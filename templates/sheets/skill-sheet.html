<div class="hol-sheet-inner skill-sheet" autocomplete="off">
    <header class="sheet-header">
        <img class="sheet-portrait" src="{{img}}" alt="{{name}}" />
        <div class="header-info">
            <h1 class="sheet-title"><input type="text" name="name" value="{{name}}" placeholder="Skill Name" /></h1>
            <div class="header-details">
                <div class="inline-field">
                    <label>Type</label>
                    <select name="system.type">
                        <option value="">--</option>
                        <option value="technique" {{#if (eq system.type "technique")}}selected{{/if}}>Technique</option>
                        <option value="action" {{#if (eq system.type "action")}}selected{{/if}}>Action</option>
                        <option value="strategy" {{#if (eq system.type "strategy")}}selected{{/if}}>Strategy</option>
                        <option value="reflex" {{#if (eq system.type "reflex")}}selected{{/if}}>Reflex</option>
                        <option value="passive" {{#if (eq system.type "passive")}}selected{{/if}}>Passive</option>
                    </select>
                </div>
                <div class="inline-field">
                    <label>Charge</label>
                    <input type="number" name="system.requiredCharge" value="{{system.requiredCharge}}" min="0" placeholder="0" />
                </div>
            </div>
        </div>
    </header>

    <nav class="sheet-tabs tabs">
        <a class="item" data-tab="effect">Effect</a>
        <a class="item" data-tab="requirements">Requirements</a>
    </nav>

    <section class="sheet-body">
        <div class="tab" data-tab="effect">
            <div class="form-group stretch">
                <label>Effect</label>
                <textarea name="system.effect" rows="12">{{system.effect}}</textarea>
            </div>
        </div>

        <div class="tab" data-tab="requirements">
            <h3>Access</h3>
            <div class="field-grid">
                <div class="form-group">
                    <label>Type Group</label>
                    <input type="text" name="system.typeGroup" value="{{system.typeGroup}}" placeholder="all-access" />
                </div>
            </div>
            <h3>Prerequisites</h3>
            <div class="form-group">
                <label>Comma separated</label>
                <input type="text" name="system.prerequisite" value="{{join system.prerequisite ', '}}" placeholder="level:5, weapon:sword|lance|axe" />
            </div>
            <div class="tag-list">
                {{#each system.prerequisite}}
                    <span class="hol-tag">{{this}}</span>
                {{else}}
                    <span class="empty-text">No prerequisites</span>
                {{/each}}
            </div>
            <p class="hol-hint">Supported kinds: <code>level:</code>, <code>movement:</code>, <code>skill:</code>, <code>weapon:</code>, <code>trait:</code>, <code>exclusive:</code>, <code>requires:</code>.</p>
        </div>
    </section>
</div>
