<div class="hol-sheet-inner consumable-sheet" autocomplete="off">
    <header class="sheet-header">
        <img class="sheet-portrait" src="{{img}}" alt="{{name}}" />
        <div class="header-info">
            <h1 class="sheet-title"><input type="text" name="name" value="{{name}}" placeholder="Consumable Name" /></h1>
            <div class="header-details">
                <div class="inline-field">
                    <label>Range</label>
                    <select name="system.range">
                        <option value="">--</option>
                        <option value="Self" {{#if (eq system.range "Self")}}selected{{/if}}>Self</option>
                        <option value="1" {{#if (eq system.range "1")}}selected{{/if}}>1</option>
                        <option value="N/A" {{#if (eq system.range "N/A")}}selected{{/if}}>N/A</option>
                    </select>
                </div>
                <div class="inline-field">
                    <label>Uses</label>
                    <input type="number" name="system.uses" value="{{system.uses}}" min="1" />
                </div>
                <div class="inline-field">
                    <label>Cost (G)</label>
                    <input type="number" name="system.costG" value="{{system.costG}}" min="0" />
                </div>
            </div>
        </div>
    </header>

    <nav class="sheet-tabs tabs">
        <a class="item" data-tab="effect">Effect</a>
        <a class="item" data-tab="stat-bonuses">Temporary Bonuses</a>
    </nav>

    <section class="sheet-body">
        <div class="tab" data-tab="effect">
            <div class="form-group stretch">
                <label>Effect Description</label>
                <textarea name="system.effect" rows="12">{{system.effect}}</textarea>
            </div>
        </div>

        <div class="tab" data-tab="stat-bonuses">
            <h3>Temporary Stat Bonuses</h3>
            <div class="stat-bonus-grid">
                <div class="stat-row"><label>HP</label><input type="number" name="system.temporaryStatBonuses.hp" value="{{system.temporaryStatBonuses.hp}}" placeholder="0" /></div>
                <div class="stat-row"><label>Atk</label><input type="number" name="system.temporaryStatBonuses.atk" value="{{system.temporaryStatBonuses.atk}}" placeholder="0" /></div>
                <div class="stat-row"><label>Spd</label><input type="number" name="system.temporaryStatBonuses.spd" value="{{system.temporaryStatBonuses.spd}}" placeholder="0" /></div>
                <div class="stat-row"><label>Dex</label><input type="number" name="system.temporaryStatBonuses.dex" value="{{system.temporaryStatBonuses.dex}}" placeholder="0" /></div>
                <div class="stat-row"><label>Def</label><input type="number" name="system.temporaryStatBonuses.def" value="{{system.temporaryStatBonuses.def}}" placeholder="0" /></div>
                <div class="stat-row"><label>Res</label><input type="number" name="system.temporaryStatBonuses.res" value="{{system.temporaryStatBonuses.res}}" placeholder="0" /></div>
                <div class="stat-row"><label>Luck</label><input type="number" name="system.temporaryStatBonuses.luck" value="{{system.temporaryStatBonuses.luck}}" placeholder="0" /></div>
                <div class="stat-row"><label>Hit</label><input type="number" name="system.temporaryStatBonuses.hit" value="{{system.temporaryStatBonuses.hit}}" placeholder="0" /></div>
                <div class="stat-row"><label>Avoid</label><input type="number" name="system.temporaryStatBonuses.avoid" value="{{system.temporaryStatBonuses.avoid}}" placeholder="0" /></div>
                <div class="stat-row"><label>Crit</label><input type="number" name="system.temporaryStatBonuses.crit" value="{{system.temporaryStatBonuses.crit}}" placeholder="0" /></div>
                <div class="stat-row"><label>Mov</label><input type="number" name="system.temporaryStatBonuses.mov" value="{{system.temporaryStatBonuses.mov}}" placeholder="0" /></div>
            </div>
        </div>
    </section>
</div>
